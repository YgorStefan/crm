name: Deploy
on:
  push:
    branches: [main, master]
concurrency:
  group: deploy-crm
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # atualiza o scaffold antes: garante que o deploy.sh executado é o da main do oracle
          script: |
            git -C /opt/apps/oracle pull --ff-only
            /opt/apps/oracle/scripts/deploy.sh crm
