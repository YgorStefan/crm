name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASS: root
  DB_NAME: crm_db
  DB_CHARSET: utf8mb4
  APP_URL: http://localhost:8000
  # 'development' (não 'production') para que falhas apareçam na tela/log
  # do servidor de teste em vez de virar HTTP 500 silencioso e mascarar
  # falhas reais dos specs E2E/carga.
  APP_ENV: development

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crm_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, pdo_mysql, gd, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências PHP (composer)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependências Node (npm)
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Compilar CSS (Tailwind)
        run: npm run build

      - name: Criar .env de teste
        run: |
          cat > .env <<EOF
          APP_URL=${APP_URL}
          APP_NAME=CRM Empresarial
          APP_ENV=${APP_ENV}
          SESSION_NAME=crm_session
          SESSION_LIFETIME=7200
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASS=${DB_PASS}
          DB_CHARSET=${DB_CHARSET}
          EOF

      - name: Aguardar MySQL ficar pronto
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      - name: Importar schema do banco
        run: mysql -h127.0.0.1 -uroot -proot crm_db < database/schema.sql

      - name: Registrar baseline das migrations
        run: php bin/migrate.php --baseline

      - name: Rodar testes PHPUnit (unitário + integração)
        run: composer test

      - name: Subir servidor PHP embutido em background
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php -S localhost:8000 -t public router.php > php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/login > /dev/null && break
            sleep 1
          done

      - name: Rodar testes E2E (Playwright)
        run: npx playwright test

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.7.1'

      - name: Resetar rate-limit de login antes do k6
        run: php tests/smoke/reset-rate-limit.php

      - name: Rodar smoke de carga (k6)
        run: k6 run tests/load/k6-smoke.js

      - name: Exibir log do servidor PHP em caso de falha
        if: failure()
        run: cat php-server.log || true
